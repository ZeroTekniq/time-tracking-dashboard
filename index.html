<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./dist/styles.css">

  <title>Time tracking dashboard</title>
</head>
<body>

  <main class="wrapper">
    <section id="profile" class="profile-card" style="grid-area: box-1" aria-labelledby="profile-heading">
      <div class="profile-card__back">
        <div class="profile-card__face">
          <img class="profile-card__img" src="./images/image-jeremy.png" alt="Jeremy Robson profile picture">
          <div class="profile-card__name-flexbox">
            <p class="profile__title">Report for</p>
            <p class="profile__name">Jeremy Robson</p>
          </div>
        </div>
          <div class="button-flexbox">
            <button class="profile-button" data-option="daily">Daily</button>
            <button class="profile-button" data-option="weekly">Weekly</button>
            <button class="profile-button" data-option="monthly">Monthly</button>
          </div>
      </div>
    </section>
    <section class="section__hours">
      <div class="card-container" style="grid-area: box-2" aria-labelledby="work-heading">
        <div class="card-container__backing work">
        <div class="card-container__face" aria-label="View work activity details">
          <button class="card-container__button">Work</button>
          <div class="card-container__hours">
            <p class="card-container__current-time" aria-label="Current week: 32 hours">32hrs</p>
            <p class="card-container__previous-time" aria-label="Last week: 36 hours">Previous - 36hrs</p>
          </div>
        </div>
        </div>
      </div>
      <div class="card-container" style="grid-area: box-3" aria-labelledby="play-heading">
        <div class="card-container__backing play">
        <div class="card-container__face" aria-label="View play activity details">
          <button class="card-container__button">Play</button>
          <div class="card-container__hours">
            <p class="card-container__current-time" aria-label="Current week: 10 hours">10hrs</p>
            <p class="card-container__previous-time" aria-label="Last week: 8 hours">Previous - 8hrs</p>
          </div>
        </div>
        </div>
      </div>
      <div class="card-container" style="grid-area: box-4" aria-labelledby="study-heading">
        <div class="card-container__backing study">
        <div class="card-container__face" aria-label="View study activity details">
          <button class="card-container__button">Study</button>
          <div class="card-container__hours">
            <p class="card-container__current-time" aria-label="Current week: 4 hours">4hrs</p>
            <p class="card-container__previous-time" aria-label="Last week: 7 hours">Previous - 7hrs</p>
          </div>
        </div>
        </div>
      </div>
      <div class="card-container" style="grid-area: box-5" aria-labelledby="exercise-heading">
        <div class="card-container__backing exercise">
        <div class="card-container__face" aria-label="View exercise activity details">
          <button class="card-container__button">Exercise</button>
          <div class="card-container__hours">
            <p class="card-container__current-time" aria-label="Current week: 4 hours">4hrs</p>
            <p class="card-container__previous-time" aria-label="Last week: 5 hours">Previous - 5hrs</p>
          </div>
        </div>
        </div>
      </div>
      <div class="card-container" style="grid-area: box-6" aria-labelledby="social-heading">
        <div class="card-container__backing social">
        <div class="card-container__face" aria-label="View social activity details">
          <button class="card-container__button">Social</button>
          <div class="card-container__hours">
            <p class="card-container__current-time" aria-label="Current week: 5 hours">5hrs</p>
            <p class="card-container__previous-time" aria-label="Last week: 10 hours">Previous - 10hrs</p>
          </div>
        </div>
        </div>
      </div>
      <div class="card-container" style="grid-area: box-7" aria-labelledby="self-care-heading">
        <div class="card-container__backing self-care">
        <div class="card-container__face" aria-label="View self care activity details">
          <button class="card-container__button">Self Care</button>
          <div class="card-container__hours">
            <p class="card-container__current-time" aria-label="Current week: 2 hours">2hrs</p>
            <p class="card-container__previous-time" aria-label="Last week: 2 hours">Previous - 2hrs</p>
          </div>
        </div>
        </div>
      </div> 
    </section>
  </main>

  
<script src="./dist/script.js"></script>
</body>
</html>
