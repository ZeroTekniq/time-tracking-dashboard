<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./dist/styles.css">

  <title>Frontend Mentor | Time tracking dashboard</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <section class="profile-card">
    <div class="profile-card__back">
      <div class="profile-card__face">
        <img class="profile-card__img" src="./images/image-jeremy.png" alt="Jeremy Robson profile picture">
        <div class="profile-card__name-flexbox">
          <p class="profile__title">Report for</p>
          <p class="profile__name">Jeremy Robson</p>
        </div>
      </div>
        <div class="button-flexbox">
          <button class="profile-button" data-option="daily">Daily</button>
          <button class="profile-button" data-option="weekly">Weekly</button>
          <button class="profile-button" data-option="monthly">Monthly</button>
        </div>
    </div>
  </section>

  <section class="section__hours">
    <!-- Time cards rendered here from script -->
  </section>

  
<script src="./dist/script.js"></script>
</body>
</html>
